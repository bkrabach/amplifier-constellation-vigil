[project]
name = "amplifier-constellation-vigil"
version = "0.1.16"
description = "Vigil: an always-on mind for an Amplifier Constellation Agent Instance. ACP conductor, presence brief, memory, decisions and timers over any ACP runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "agent-client-protocol>=1.0.0,<2",
  "aiohttp>=3.9,<4",
]

[project.scripts]
vigil = "vigil.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "E701", "B904"]
